[project]
name = "junction-lab"
version = "0.1.0"
description = "NTCIP 1202 speaking virtual traffic signal controller, central management system and traffic-control algorithm lab"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pyjwt>=2.8",
]

[project.scripts]
jl-controller = "junctionlab.controller.main:main"
jl-center = "junctionlab.center.main:main"
jl-snmp = "junctionlab.tools.snmpcli:main"
jl-experiments = "junctionlab.sim.experiments:main"
jl-bench = "junctionlab.sim.bench:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/junctionlab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]
# B008: FastAPI Depends() in defaults is the framework idiom; B905/ASYNC109/SIM105: style only
ignore = ["B008", "B905", "ASYNC109", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B023"]
